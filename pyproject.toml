[tool.ruff]
# Vercel may run the app on Python 3.9, so keep the code 3.9-compatible.
target-version = "py39"
exclude = [
    "submodules",
    "tmp"
]

[tool.ruff.lint]
# FastAPI evaluates parameter annotations at runtime, so `X | None` breaks on 3.9
# even with `from __future__ import annotations`. Keep typing.Optional.
extend-ignore = ["FA", "UP"]

[tool.black]
preview = true
