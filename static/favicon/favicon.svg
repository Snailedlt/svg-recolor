<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<style>#dark{display:none}@media (prefers-color-scheme:dark){#light{display:none}#dark{display:inline}}</style>
<defs>
<image id="logo" width="650" height="650" href="data:image/png;base64,"/>
<clipPath id="cl"><rect width="1000" height="1000" rx="250"/></clipPath>
<clipPath id="cd"><rect width="1000" height="1000" rx="350"/></clipPath>
</defs>
<g id="light" clip-path="url(#cl)"><rect width="1000" height="1000" fill="#c2cfd2"/><use href="#logo" transform="matrix(1.3846153846153846,0,0,1.3846153846153846,50,50)"/></g>
<g id="dark" clip-path="url(#cd)"><rect width="1000" height="1000" fill="#c2cfd2"/><use href="#logo" transform="matrix(1.0769230769230769,0,0,1.0769230769230769,150,150)"/></g>
</svg>
