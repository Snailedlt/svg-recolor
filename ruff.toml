# Lint settings live here, not in pyproject.toml: Vercel's Python builder installs
# dependencies from pyproject.toml whenever one exists (ahead of Pipfile.lock), and
# a pyproject.toml with only tool settings means nothing gets installed.

# The code avoids `X | None` (FastAPI evaluates parameter annotations at runtime,
# and that syntax needs 3.10+), so it still imports on older Pythons.
target-version = "py39"
exclude = [
    "submodules",
    "tmp",
]

[lint]
extend-ignore = ["FA", "UP"]
