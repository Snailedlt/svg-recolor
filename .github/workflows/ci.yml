name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (engine, API, MCP, browser parity)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is what Pipfile asks for; 3.12 is Vercel's default Python runtime.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked dependencies
        run: |
          pip install pipenv
          pipenv requirements > requirements.lock.txt
          pip install -r requirements.lock.txt pytest tree-sitter-language-pack
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
        env:
          SENTRY_DSN: ""

  javascript:
    name: JavaScript (code formats compile, API snippets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test

  php:
    name: PHP (Laravel Blade format renders with real Blade)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/php
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: node generate.mjs
      - run: php blade-test.php

  live-snippets:
    name: API snippets run against a live server (13 languages + Blazor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kotlin
        run: sudo snap install kotlin --classic
      - name: Install the app and Python clients
        run: |
          pip install pipenv
          pipenv requirements > requirements.lock.txt
          pip install -r requirements.lock.txt requests httpie
      - name: Run every snippet against the server
        run: bash tests/live/run.sh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"

  e2e:
    name: Browser tests (editor flows, accessibility, CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the app
        run: |
          pip install pipenv
          pipenv requirements > requirements.lock.txt
          pip install -r requirements.lock.txt
      - name: Install browser test tools
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the server
        run: |
          SENTRY_DSN= RATE_LIMIT_WORK=0 RATE_LIMIT_MAP=0 python -m uvicorn main:app --port 8000 &
          for i in $(seq 50); do curl -sf http://127.0.0.1:8000/api/modes >/dev/null && break; sleep 0.2; done
      - name: Run browser tests
        working-directory: tests/e2e
        run: npm test
        env:
          BASE_URL: http://127.0.0.1:8000
